name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E tests
        run: npm run test:e2e

      - name: Build + size budgets
        run: npm run size

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish-docs:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # docs/guides, docs/examples, docs/index.html, docs/docs.css are
      # committed as hand-written static files; docs/api is typedoc
      # output and gitignored (regenerated fresh here) — see docs script.
      - name: Build docs
        run: npm run docs

      # PAGES_DEPLOY_TOKEN: a Personal Access Token (repo scope) with write
      # access to MichaelYagi/michaelyagi.github.io — the default
      # GITHUB_TOKEN can only push to this repo, not that one. Add it under
      # this repo's Settings → Secrets and variables → Actions.
      - name: Checkout michaelyagi.github.io
        uses: actions/checkout@v4
        with:
          repository: MichaelYagi/michaelyagi.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-site

      - name: Sync docs into pages-site/shoji
        run: |
          rm -rf pages-site/shoji
          mkdir -p pages-site/shoji
          cp -r docs/. pages-site/shoji/

      - name: Commit and push if changed
        working-directory: pages-site
        run: |
          git config user.name "shoji-docs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add shoji
          if git diff --cached --quiet; then
            echo "No doc changes to publish."
            exit 0
          fi
          git commit -m "Update shoji docs (MichaelYagi/shoji@${{ github.sha }})"
          git push
