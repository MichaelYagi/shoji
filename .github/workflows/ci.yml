name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E tests
        run: npm run test:e2e

      - name: Build + size budgets
        run: npm run size

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Raw per-test traces (playwright.config.ts's trace:
      # 'retain-on-failure'), uploaded separately from the HTML report above
      # as a redundant path to the same trace.zip files it links to — in
      # case the report's own attachment references ever don't resolve
      # (e.g. downloaded standalone rather than served via `playwright
      # show-report`), the raw files are still directly reachable here.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  publish-docs:
    needs: verify
    # workflow_dispatch included so a manual "Run workflow" also republishes
    # (e.g. re-triggering after a dropped push-event notification, or an
    # on-demand republish) — both still require actually being on main.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # docs/guides, docs/examples, docs/index.html, docs/docs.css are
      # committed as hand-written static files; docs/api (typedoc output)
      # and docs/dist/shoji.min.{js,css} (the runtime bundle
      # docs/examples/*.html load directly) are both gitignored, built
      # fresh here — the latter via `npm run build` itself (see
      # scripts/build.mjs's copyDocsRuntimeAssets), not a separate step.
      - name: Build docs + runtime bundle
        run: npm run build && npm run docs

      # PAGES_DEPLOY_TOKEN: a Personal Access Token (repo scope) with write
      # access to MichaelYagi/michaelyagi.github.io — the default
      # GITHUB_TOKEN can only push to this repo, not that one. Add it under
      # this repo's Settings → Secrets and variables → Actions.
      - name: Checkout michaelyagi.github.io
        uses: actions/checkout@v4
        with:
          repository: MichaelYagi/michaelyagi.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-site

      - name: Sync docs into pages-site/shoji
        run: |
          rm -rf pages-site/shoji
          mkdir -p pages-site/shoji
          cp -r docs/. pages-site/shoji/

      - name: Commit and push if changed
        working-directory: pages-site
        run: |
          git config user.name "shoji-docs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add shoji
          if git diff --cached --quiet; then
            echo "No doc changes to publish."
            exit 0
          fi
          git commit -m "Update shoji docs (MichaelYagi/shoji@${{ github.sha }})"
          git push

  publish-npm:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # A prerelease version (e.g. 0.1.0-alpha.6) publishes under its own
      # dist-tag (the identifier before the first '.' in the prerelease
      # part, e.g. "alpha") so it never becomes `latest` and isn't installed
      # by default — only `npm install @michaelyagi/shoji@alpha` opts in. A
      # plain version (e.g. 1.0.0) publishes as `latest`, same as a normal
      # `npm publish` with no --tag.
      - name: Determine dist-tag from package.json version
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            echo "tag=${PRERELEASE%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # NPM_TOKEN: a granular access token (Read and write, scoped to this
      # package, "Bypass 2FA" enabled) — CI can't answer an interactive OTP
      # prompt. Add it under this repo's Settings → Secrets and variables →
      # Actions. npm publish's own prepublishOnly script (package.json)
      # rebuilds dist/ fresh here, so this never ships stale output even
      # though `verify` already built it once earlier in this same run.
      - name: Publish to npm
        run: npm publish --tag ${{ steps.tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
